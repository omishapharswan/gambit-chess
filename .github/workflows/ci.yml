name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every OS finish so one platform failure does not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        # -C Release is required for multi-config generators such as Visual Studio.
        run: ctest -C Release --output-on-failure
        working-directory: build

  ui:
    name: ui tests
    runs-on: ubuntu-latest
    env:
      # Headless SDL so pygame can start on a runner with no display.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      GAMBIT_ENGINE: ${{ github.workspace }}/build/engine/gambit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build engine
        # The UI tests talk to the real binary, so it has to exist first.
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Install dependencies
        run: pip install -r ui/requirements.txt pytest
      - name: Test
        run: python -m pytest tests
        working-directory: ui

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gambit-chess .
